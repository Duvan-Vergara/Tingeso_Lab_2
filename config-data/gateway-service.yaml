server:
  port: 8080
  
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    hostname: localhost

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: m1
          uri: lb://m1
          predicates:
            - Path=/tariffs/**
        - id: m2
          uri: lb://m2
          predicates:
            - Path=/desctnumber/**
        - id: m3
          uri: lb://m3
          predicates:
            - Path=/desctfrecu/**
        - id: m4
          uri: lb://m4
          predicates:
            - Path=/tariffspecial/**
        - id: m5
          uri: lb://m5
          predicates:
            - Path=/reserves/**