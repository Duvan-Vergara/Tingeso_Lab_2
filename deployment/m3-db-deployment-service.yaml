apiVersion: v1
kind: PersistentVolume
metadata:
  name: m3-db-pv
  labels:
    type: local
spec:
  storageClassName: standard
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/data/m3-db-data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: m3-db-pvc
  labels:
    app: mysql
    tier: database
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m3-db-deployment
  labels:
    app: m3-db-deployment
    tier: database
spec:
  selector:
    matchLabels:
      app: m3-db-deployment
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: m3-db-deployment
        tier: database
    spec:
      containers:
        - name: m3-db
          image: mysql:latest
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: mysql-config-map
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: mysql-config-map
                  key: MYSQL_PASSWORD
          volumeMounts:
            - mountPath: /var/lib/mysql/data
              name: m3-db-data
      volumes:
        - name: m3-db-data
          persistentVolumeClaim:
            claimName: m3-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: m3-db-service
  labels:
    app: m3-db-service
    tier: database
spec:
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
  selector:
    app: m3-db-deployment
    tier: database
  type: ClusterIP